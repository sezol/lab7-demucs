apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  selector:
    matchLabels:
      app: minio
  replicas: 1
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: s3
        image: zenko/cloudserver
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 500Mi
        env:
        - name: SCALITY_ACCESS_KEY_ID
          value: "accessKey1"
        - name: SCALITY_SECRET_ACCESS_KEY
          value: "verySecretKey1"
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
