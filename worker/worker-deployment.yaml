apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  selector:
    matchLabels:
      app: worker
  replicas: 1
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: us-docker.pkg.dev/tokyo-concept-506804-m0/demucs/demucs-worker:v1
        resources:
          requests:
            cpu: 1000m
            memory: 6Gi
          limits:
            memory: 10Gi
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: MINIO_HOST
          value: "minio:8000"
        - name: MINIO_USER
          value: "accessKey1"
        - name: MINIO_PASSWORD
          value: "verySecretKey1"
